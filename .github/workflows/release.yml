name: release

# Tag push (`v0.1.0`, …) → build the TTS runtime per platform, package it per
# senclaw/docs/runtime-protocol.md §2.3, publish the archives + sha256 on the
# GitHub release. Checks out SenClaw/senclaw as a sibling directory so the
# `../senclaw/crates/sen-runtime-sdk` path dependency resolves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          # No darwin-x64: `ort` ships no prebuilt ONNX Runtime for
          # x86_64-apple-darwin (its build script refuses the target).
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # linux-arm64 / windows-arm64 (also declared in senclaw-runtime.json)
          # need a cross toolchain this workflow does not set up yet; build
          # those manually with `make package` on native hardware until then.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sen-tts
      - uses: actions/checkout@v4
        with:
          repository: SenClaw/senclaw
          path: senclaw
      - uses: dtolnay/rust-toolchain@stable
      - name: make package
        working-directory: sen-tts
        shell: bash
        env:
          CARGO_BUILD_JOBS: "4"
        run: make package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sen-tts/dist/*.tar.gz
            sen-tts/dist/*.tar.gz.sha256
